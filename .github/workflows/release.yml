name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x64
            executable: postmote
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            executable: postmote
          - runner: macos-15-intel
            asset: macos-x64
            executable: postmote
          - runner: macos-15
            asset: macos-arm64
            executable: postmote
          - runner: windows-2025
            asset: windows-x64.exe
            executable: postmote.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Verify executable and stage release asset
        shell: bash
        run: |
          ./dist/${{ matrix.executable }} --version
          mkdir -p release-assets
          cp "dist/${{ matrix.executable }}" "release-assets/postmote-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: postmote-${{ matrix.asset }}
          path: release-assets/postmote-${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: postmote-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum postmote-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "$GITHUB_REF_NAME"
