name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install NSS test tools
        run: sudo apt-get update -qq && sudo apt-get install -y libnss3-tools libnss3-dev pkg-config
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: ./dist/postmote --version
      - run: POSTMOTE_TEST_BINARY="$PWD/dist/postmote" bun test tests/stdio.test.ts tests/thunderbird-credentials.test.ts
      - run: POSTMOTE_TEST_BINARY="$PWD/dist/postmote" sh scripts/test-mail-integration.sh
      - run: bun audit
